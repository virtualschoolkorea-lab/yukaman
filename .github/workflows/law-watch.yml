# 법령 감시(2026-11-05 휴먼쌤 "이 앱이 계속 정보가 최신화되어야"). 매주 월요일 아침 국가법령정보센터의 시행일과 근거 조문 글자를 저장소의 기준과 비교한다.
# 바뀐 것이 있으면 이슈를 열고(GitHub가 저장소 주인에게 메일을 보낸다), 없어지면 닫는다. 사이트를 못 읽으면 실패로 끝난다. 글과 화면은 고치지 않으니 이 일이 공개에 영향을 주지는 않는다.
name: law-watch
on:
  schedule:
    - cron: '0 0 * * 1'      # 월요일 09:00(한국)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 법령 비교
        id: check
        run: |
          set +e
          python3 -X utf8 tools/check_laws.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then exit 1; fi
          exit 0
      - name: 이슈 열기 또는 닫기
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/post_issue.sh "법령이 바뀌었어요" law-watch.md
