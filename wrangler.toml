# 육아맨 — Cloudflare Pages(화면 public/) + Functions(서버 functions/·server/) + D1(글·댓글).
# 내 컴퓨터 미리 보기: python -X utf8 deploy.py dev [--port 8799]   (가짜 D1에 schema.sql·test/seed-local.sql을 넣고 http://127.0.0.1:8799)
# 처음 한 번(운영자가 시킨 뒤): python -X utf8 deploy.py setup       (D1 만들기 → 아래 database_id 채움 → 표 만들기 → Pages 프로젝트 만들기)
# 올리기: python -X utf8 deploy.py deploy
name = "yukaman"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "yukaman"
database_id = "e3190dc5-bbc1-41be-b3f9-4ebf5b0865fa"
# ↑ deploy.py setup이 실제 값으로 바꿈. 내 컴퓨터 미리 보기(--local)에서는 아무 값이어도 된다.

[vars]
# 카카오 로그인 REST API 키(동의 화면 주소에 어차피 보이는 값). 비어 있으면 꺼진다. 함께 켤 것: public/config.js KAKAO_LOGIN, wrangler pages secret KAKAO_CLIENT_SECRET · KAKAO_ADMIN_KEY
KAKAO_REST_KEY = ""
# 네이버 로그인 Client ID(동의 화면 주소에 어차피 보이는 값). 비어 있으면 꺼진다. 함께 켤 것: public/config.js NAVER_LOGIN, wrangler pages secret NAVER_CLIENT_SECRET, 아래 LOGIN_METHOD. 순서는 저장소 CLAUDE.md '네이버 로그인 켜기'
# 2026-11-12: 새 주소로 네이버 앱을 새로 등록하기 전이라 비워 둠(로그인 단추를 누르면 '꺼져 있음'으로 답한다)
NAVER_CLIENT_ID = "4AeVBH5OeqXac3TWACk9"
# "naver"면 성별 확인을 돌아갈 길을 닫는다(카카오 새 가입 · 네이버 없는 가입 · 회원의 초대 코드 만들기 · 신청서). "kakao"면 지금까지와 같다
LOGIN_METHOD = "naver"
